[workspace]
name = "pixi-cross"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
rust = ">=1.89,<2"
rattler-build = "*"
coreutils = "*"

[tasks]
build = "cargo build --locked --release"
test = "cargo test --locked"
test-openssl = "bash tests/openssl.sh"

[tasks.packages]
args = [{ arg = "channel", default = "target/channel" }]
depends-on = ["build"]
env = { CONDA_BLD_PATH = "{{ channel }}" }
cmd = "rattler-build build --recipe-dir recipes --skip-existing local"
